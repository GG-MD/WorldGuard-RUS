    default-message: '&c&lHey!&r&7 Sorry, but you can''t %what% here.'
    default-entry-message: '&c&lHey!&r&7 You are not permitted to enter this area.'
    default-exit-message: '&c&lHey!&r&7 You are not permitted to leave this area.'
    pvp: 'PvP'
    break-that-block: 'break that block'
    break-things: 'break things'
    break-vehicles: 'break vehicles'
    change-that: 'change that'
    damage-that: 'damage that'
    drop-xp: 'drop XP'
    drop-items: 'drop items'
    harm-that: 'harm that'
    hit-that: 'hit that'
    open-that: 'open that'
    pick-up-items: 'pick up items'
    place-fire: 'place fire'
    place-that-block: 'place that block'
    place-things: 'place things'
    place-vehicles: 'place vehicles'
    ride-that: 'ride that'
    sleep: 'sleep'
    take-that: 'take that'
    use-anchors: 'use anchors'
    use-dynamite: 'use dynamite'
    use-explosives: 'use explosives'
    use-frostwalker: 'use frostwalker'
    use-lingering-potions: 'use lingering potions'
    use-that: 'use that'
    chat: 'chat'
    # Prefix for the denied-command message; the command follows
    use-command: 'use '
  disembark:
    warning: 'Don''t disembark here!'
    detail: ' You can''t get back on.'
  # Sign-based chest protection messages
  chest:
    spot-no-permission: 'This spot is for a chest that you don''t have permission for.'
    protected: 'This chest is protected.'
    not-owner-adjacent: 'You do not own the adjacent chest.'
    sign-must-be-post: 'The [Lock] sign must be a sign post, not a wall sign.'
    first-line-name: 'The first owner line must be your name.'
    unsafe-block: 'That is not a safe block that you''re putting this sign on.'
    now-protected: 'A chest or double chest above is now protected.'
    disabled: 'WorldGuard''s sign chest protection is disabled.'
  # Blocked potion/arrow effect messages. {effect} = effect name
  potions:
    arrows-disabled: 'Sorry, arrows with {effect} are presently disabled.'
    cant-throw: 'Sorry, potions with {effect} can''t be thrown, even if you have a permission to bypass it, due to limitations (and because overly-reliable potion blocking is on).'
