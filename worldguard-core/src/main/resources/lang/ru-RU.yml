#
# WorldGuard - файл сообщений (русский, ru-RU)
#
# Отредактируйте текст справа от двоеточия. Плейсхолдеры вида {name}
# трогать нельзя - только текст вокруг. Любую строку можно удалить -
# плагин подставит английское значение по умолчанию. Только пробелы,
# без табов. Смена языка: опция 'locale' в config.yml.
# Цвета: можно использовать коды вида &c, &a, &e, &l (жирный), &n и т.д.
#
# Цветовая схема (можно менять на свой вкус):
# - &7(&f&l!&7)  : префикс обычных/информационных сообщений (белый «!»)
# - &7(&c&l!&7)  : префикс ошибок и отказов (красный «!»)
# - &b           : выделенные значения (id, миры, ники, числа)
# - &6           : команды, упомянутые в тексте
# Интерактивные меню /rg info и /rg flags красит сам плагин, поэтому их
# подписи/кнопки специально оставлены без префикса.
#

# Внутренняя версия языкового файла. Не редактируйте: WorldGuard использует её
# для миграции файла при обновлении плагина (добавляет новые ключи и удаляет
# устаревшие, сохраняя ваши правки). Старый файл предварительно сохраняется в бэкап.
