#
# WorldGuard messages / language file
#
# This file lets you customize every message that WorldGuard shows to players
# and administrators. Edit the text on the right side of the colon.
#
# How it works:
# - The active language is chosen by the "locale" option in config.yml.
#   WorldGuard loads lang/<locale>.yml from this folder (default: en-US).
# - You may safely delete any line: WorldGuard falls back to the built-in
#   default for any key that is missing, so the plugin never breaks.
# - Placeholders are written as {name} and are replaced at runtime. Only use
#   the placeholders that are documented for each message.
# - Do NOT use tabs, only spaces (this is a YAML file).
# - Colours: you may use legacy codes such as &c, &a, &e, &l (bold), &n,
#   etc. anywhere in a message and the text will be coloured/styled. Leaving
#   a message without codes keeps WorldGuard's original default appearance.
#

commands:
  fire:
    # {world} = world name, {actor} = name of the sender
    already-disabled: 'Fire spread was already globally disabled.'
    disabled-broadcast: 'Fire spread has been globally disabled for ''{world}'' by {actor}.'
    already-enabled: 'Fire spread was already globally enabled.'
    enabled-broadcast: 'Fire spread has been globally for ''{world}'' re-enabled by {actor}.'
  halt-activity:
    intensive-not-allowed: 'ALL intensive server activity is not allowed.'
    intensive-allowed: 'ALL intensive server activity is allowed.'
    # Confirmation prompt shown before erasing entities. Text fragments only;
    # the clickable button and colors are added by WorldGuard.
    confirm-prefix: 'This command will '
    confirm-permanently: 'PERMANENTLY'
    confirm-suffix: ' erase ALL animals in ALL loaded chunks in ALL loaded worlds. '
    confirm-click: '[Click]'
    # {command} = the command being confirmed
    confirm-click-hover: 'Click to confirm /{command}'
    confirm-or-type: ' or type '
    confirm-to-confirm: ' to confirm.'
    # {actor} = name of the sender
    halted: 'ALL intensive server activity halted.'
    halted-broadcast: 'ALL intensive server activity halted by {actor}.'
    halted-silent: '(Silent) ALL intensive server activity halted by {actor}.'
    # {count} = number of entities removed, {world} = world name
